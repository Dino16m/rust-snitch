[package]
name = "snitch"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
cron = "0.15.0"
paris = { version = "1.5", features = ["timestamps", "macros"] }
microrm = "0.5.1"
uuid = { version = "1.18.1", features = ["v4", "v7"] }
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
fake = "4.4.0"
